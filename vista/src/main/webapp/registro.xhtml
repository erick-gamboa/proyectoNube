<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Crear cuenta</title>
</h:head>

<h:body>

    <h:form id="registroForm">

        <h2>Crear cuenta</h2>

        <p:messages id="messages"
                    showDetail="true"
                    closable="true"/>

        <p:outputLabel for="nombre" value="Nombre de usuario"/>
        <p:inputText id="nombre"
                     value="#{registroBean.usuario.nombreUsuario}"
                     required="true"/>

        <br/><br/>

        <p:outputLabel for="correo" value="Correo electrónico"/>
        <p:inputText id="correo"
                     value="#{registroBean.usuario.correo}"
                     required="true"/>

        <br/><br/>

        <p:outputLabel for="password" value="Contraseña"/>
        <p:password id="password"
                    value="#{registroBean.usuario.password}"
                    required="true"
                    feedback="false"/>

        <br/><br/>

        <p:commandButton value="CREAR CUENTA"
                         action="#{registroBean.registrar}"
                         update="messages"
                         process="@form"/>

        <br/><br/>

        <p:button value="Volver al login"
                  outcome="/login.xhtml"/>

    </h:form>

</h:body>
</html>
