<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Crear cuenta - VINILO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

    <div class="acceso-pagina">
    <div class="acceso-contenido">
    <div class="login-container">

        <h:form id="registroForm">


            <p:growl id="messages" showDetail="true" life="5000" sticky="false"/>

            <h1 class="titulo-login">Crear cuenta</h1>

            <div class="input-group">
                <h:outputLabel for="nombre" value="Nombre de usuario" styleClass="campo-label"/>
                <p:inputText id="nombre"
                             value="#{registroBean.usuario.nombreUsuario}"
                             styleClass="input-field"
                             placeholder="Ingresa tu nombre"
                             required="true"
                             requiredMessage="El nombre de usuario es obligatorio"/>
            </div>

            <div class="input-group">
                <h:outputLabel for="correo" value="Correo electrónico" styleClass="campo-label"/>
                <p:inputText id="correo"
                             value="#{registroBean.usuario.correo}"
                             styleClass="input-field"
                             placeholder="Ingresa tu correo"
                             required="true"
                             requiredMessage="El correo es obligatorio"/>
            </div>

            <div class="input-group">
                <h:outputLabel for="password" value="Contraseña" styleClass="campo-label"/>
                <p:password id="password"
                            value="#{registroBean.usuario.password}"
                            styleClass="input-field"
                            placeholder="Ingresa tu contraseña"
                            required="true"
                            feedback="false"
                            requiredMessage="La contraseña es obligatoria"/>
            </div>

            <p:commandButton value="Crear cuenta"
                             action="#{registroBean.registrar}"
                             process="@form"
                             update="messages"
                             styleClass="btn-iniciar"/>

            <h:button value="Volver al login"
                      outcome="/login.xhtml"
                      styleClass="btn-registro"/>

        </h:form>

    </div>
    <h:link outcome="/index.xhtml" styleClass="volver-catalogo">← Volver al catálogo</h:link>
    </div>
    </div>

</h:body>
</html>
