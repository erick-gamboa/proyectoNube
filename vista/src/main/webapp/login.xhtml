<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Iniciar Sesión - Vinilos</title>
        <link rel="stylesheet" type="text/css" href="resources/css/style.css"/>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: Arial, sans-serif;
                background-color: #fbf5f4;
                color: #514747;
            }

            /* Barra superior con botón Categorías */
            .top-bar {
                background-color: #ffffff;
                border-bottom: 1px solid #eee5e3;
                padding: 16px 35px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .btn-categorias {
                background-color: #d32f2f;
                color: #ffffff;
                border: none;
                border-radius: 6px;
                padding: 10px 20px;
                font-size: 18px;
                font-weight: bold;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .btn-categorias:hover {
                background-color: #f0e2e0;
            }

            .menu-icon {
                font-size: 20px;
            }

            /* Contenedor del formulario de login */
            .login-container {
                max-width: 450px;
                margin: 40px auto;
                padding: 0 20px;
            }

            .titulo-login {
                color: #7ed957;
                font-size: 28px;
                font-weight: bold;
                margin-bottom: 30px;
                letter-spacing: 1px;
            }

            .campo-label {
                display: block;
                font-size: 16px;
                color: #666666;
                margin-bottom: 8px;
                font-weight: normal;
            }

            .input-group {
                position: relative;
                margin-bottom: 20px;
            }

            .input-icon {
                position: absolute;
                left: 18px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 20px;
                color: #999999;
                pointer-events: none;
                z-index: 2;
            }

            .input-field {
                width: 100%;
                padding: 14px 16px 14px 50px;
                font-size: 16px;
                border: none;
                border-radius: 30px;
                background-color: #f0f0f0;
                color: #333333;
                outline: none;
            }

            .input-field::placeholder {
                color: #999999;
            }

            .input-field:focus {
                background-color: #e8e8e8;
            }

            .texto-ayuda {
                font-size: 14px;
                color: #555555;
                margin-bottom: 10px;
            }

            .enlaces-ayuda {
                display: flex;
                justify-content: space-between;
                margin-bottom: 25px;
                font-size: 14px;
            }

            .enlaces-ayuda a {
                color: #333333;
                text-decoration: underline;
            }

            .enlaces-ayuda a:hover {
                color: #7ed957;
            }

            .btn-iniciar {
                width: 100%;
                background-color: #7ed957;
                color: #ffffff;
                border: none;
                border-radius: 30px;
                padding: 14px 0;
                font-size: 16px;
                font-weight: bold;
                cursor: pointer;
            }

            .btn-iniciar:hover {
                background-color: #6cc24a;
            }

            /* Mensajes de PrimeFaces */
            .ui-messages {
                margin-bottom: 20px;
            }
        </style>
    </h:head>

    <h:body>



        <div class="login-container">

            <h:form id="loginForm">

                <p:messages id="messages" showDetail="true" closable="true"/>

                <h1 class="titulo-login">INICIAR SESIÓN</h1>

                <div class="input-group">
                    <label class="campo-label" for="correo">CORREO ELECTRÓNICO</label>
                    <p:inputText id="correo"
                                 styleClass="input-field"
                                 placeholder="Ingresa tu correo:"
                                 autocomplete="off"
                                 value="#{loginUI.usuario.correo}" />
                </div>

                <div class="input-group">
                    <label class="campo-label" for="password">CONTRASEÑA</label>
                    <p:password id="password"
                                styleClass="input-field"
                                placeholder="Ingresa tu contraseña:"
                                value="#{loginUI.usuario.password}" />
                </div>

                <div class="texto-ayuda">
                    Los datos de acceso son sensibles a mayusculas y minusculas
                </div>



                <p:commandButton value="INICIAR SESIÓN"
                                 styleClass="btn-iniciar"
                                 action="#{loginUI.login()}"
                                 update="messages"
                                 process="@form"/>

            </h:form>

        </div>

    </h:body>
</html>
