<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Iniciar sesión - Vinilos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

    <div class="acceso-pagina">
    <div class="acceso-contenido">
    <div class="login-container">

        <h:form id="loginForm">


            <p:messages id="messages" showDetail="true" closable="true"/>

            <h1 class="titulo-login">Iniciar sesión</h1>

            <div class="input-group">
                <label class="campo-label" for="loginForm:correo">Correo electrónico</label>
                <p:inputText id="correo"
                             styleClass="input-field"
                             placeholder="Ingresa tu correo"
                             autocomplete="off"
                             value="#{loginUI.usuario.correo}"/>
            </div>

            <div class="input-group">
                <label class="campo-label" for="loginForm:password">Contraseña</label>
                <p:password id="password"
                            styleClass="input-field"
                            placeholder="Ingresa tu contraseña"
                            value="#{loginUI.usuario.password}"/>
            </div>

            <div class="texto-ayuda">
                Los datos de acceso distinguen mayúsculas y minúsculas.
            </div>

            <h:commandButton value="Iniciar sesión"
                             action="#{loginUI.login()}"
                             styleClass="btn-iniciar"/>

            <h:button value="Crear cuenta"
                      outcome="/registro.xhtml"
                      styleClass="btn-registro"/>

        </h:form>

    </div>
    <h:link outcome="/index.xhtml" styleClass="volver-catalogo">← Volver al catálogo</h:link>
    </div>
    </div>

</h:body>
</html>
