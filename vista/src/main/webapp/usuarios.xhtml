<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Usuarios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
    <h:outputStylesheet library="css" name="admin.css"/>
</h:head>

<h:body>

    <ui:include src="/menu-admin.xhtml">
        <ui:param name="activo" value="usuarios"/>
    </ui:include>

    <main class="contenido">

        <h1 class="titulo-pagina">Usuarios</h1>

        <p:growl id="msgs" showDetail="true" life="4000"/>

        <section class="panel">

            <h:form id="formUsuarios">

                <p:dataTable id="tablaUsuarios"
                             value="#{usuarioBean.listaUsuarios}"
                             var="usuario"
                             style="width: 100%;"
                             emptyMessage="No hay usuarios registrados">

                    <p:column headerText="ID">
                        <h:outputText value="#{usuario.idUsuario}"/>
                    </p:column>

                    <p:column headerText="Correo">
                        <h:outputText value="#{usuario.correo}"/>
                    </p:column>

                    <p:column headerText="Rol">
                        <p:selectOneMenu value="#{usuarioBean.rolesEditados[usuario.idUsuario]}">
                            <f:selectItem itemLabel="user" itemValue="user"/>
                            <f:selectItem itemLabel="admin" itemValue="admin"/>
                        </p:selectOneMenu>
                    </p:column>

                </p:dataTable>

                <div class="botones">
                    <p:commandButton value="Guardar cambios"
                                     action="#{usuarioBean.guardarRoles}"
                                     process="@form"
                                     update="tablaUsuarios :msgs"
                                     styleClass="btn-admin"/>
                </div>

            </h:form>

        </section>

    </main>

</h:body>
</html>
