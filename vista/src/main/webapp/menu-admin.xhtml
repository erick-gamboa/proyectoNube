<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <aside class="menu_lateral">

        <h:link outcome="/index.xhtml" styleClass="logo_admin">VINILOS</h:link>
        <span class="menu_sub">Panel de administración</span>

        <nav class="menu_opciones">

            <h:link outcome="/vinilos.xhtml"
                    styleClass="#{activo eq 'inventario' ? 'menu_btn menu_btn-activo' : 'menu_btn'}">
                Inventario
            </h:link>

            <h:link outcome="/stock.xhtml"
                    styleClass="#{activo eq 'stock' ? 'menu_btn menu_btn-activo' : 'menu_btn'}">
                Stock
            </h:link>

            <h:link outcome="/tickets.xhtml"
                    styleClass="#{activo eq 'tickets' ? 'menu_btn menu_btn-activo' : 'menu_btn'}">
                Tickets de compra
            </h:link>

            <h:link outcome="/usuarios.xhtml"
                    styleClass="#{activo eq 'usuarios' ? 'menu_btn menu_btn-activo' : 'menu_btn'}">
                Usuarios
            </h:link>

        </nav>

        <div class="menu_pie">

            <h:link outcome="/index.xhtml" styleClass="menu_btn">
                Ver tienda
            </h:link>

            <h:form id="formSesionAdmin">
                <h:commandButton value="Cerrar sesión"
                                 action="#{loginUI.cerrarSesion}"
                                 styleClass="menu_btn cerrar_sesion"/>
            </h:form>

        </div>

    </aside>

</ui:composition>
