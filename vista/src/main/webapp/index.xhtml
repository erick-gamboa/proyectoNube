<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>SAUAP</title>
       <!-- <h:outputStylesheet library="primefaces-saga" name="theme.css"/>-->
        <link rel="stylesheet"  type="text/css"  href="resources/css/style.css"/>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background-color: #F8EDEB; !important;
                color: #5b4747;
            }


            /* =========================
               MENÚ SUPERIOR
               ========================= */

            .menu_superior {
                display: flex;
                align-items: center;
                gap: 30px;
                padding: 15px 25px;
                background-color: #ffffff; !important;
                border-bottom: 1px solid #ddd;
            }

            .menu_superior .menu_btn {
                flex: 1;

                display: flex;
                justify-content: center;
                align-items: center;

                padding: 12px 16px;

                background-color: transparent;
                border: none;
                border-radius: 6px;

                color: #5b4747;
                font-size: 16px;
                font-weight: 600;
                text-decoration: none;

                text-align: center;
            }

            .menu_superior .menu_btn:hover {
                background-color: #ffffff;
            }

            /* =========================
               CONTENIDO PRINCIPAL
               ========================= */

            .principal {
                text-align: center;
                margin-top: 0;

                min-height: calc(100vh - 75px);
                background-image: url("#{request.contextPath}/resources/images/fondo.png");
                background-size: contain;
                background-color: #F8EDEB; !important;
                background-position: center;
                background-repeat: no-repeat;

                padding-top: 150px;
                box-sizing: border-box;
            }
        </style>
    </h:head>

    <h:body>
        <h:form>
            <div class="menu_superior"  style="background-color: #ffffff;">
                <h:link value="Alta de profesores" outcome="profesor" styleClass="menu_btn" style="font-size: 20px; font-weight: bold;"/>
                <h:link value="Unidades de aprendizaje" outcome="unidad" styleClass="menu_btn" style="font-size: 20px; font-weight: bold;" />
                <h:link value="Asignacion de materias" outcome="asignacion" styleClass="menu_btn" style="font-size: 20px; font-weight: bold;" />
                <h:link value="Consultas" outcome="consultas" styleClass="menu_btn" style="font-size: 20px; font-weight: bold;" />
                <h:link value="Inventario de Vinilos" outcome="vinilos" styleClass="menu_btn" style="font-size: 20px; font-weight: bold;" />

            </div>
        </h:form>

        <div class="principal">

        </div>

    </h:body>

</html>
