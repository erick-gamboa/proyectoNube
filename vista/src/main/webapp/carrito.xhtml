<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Mi carrito</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
</h:head>

<h:body>

    <ui:include src="/barra.xhtml"/>

    <div class="contenedor">

        <h2>Mi carrito</h2>

        <h:form id="formCarrito">

            <p:messages id="mensajes" showDetail="true"/>

            <!-- Carrito vacío -->
            <h:panelGroup rendered="#{empty carritoBean.detalles}">
                <p>Tu carrito está vacío. <h:link outcome="/index.xhtml" styleClass="seguir">Ver el catálogo</h:link></p>
            </h:panelGroup>

            <!-- Productos -->
            <ui:repeat value="#{carritoBean.detalles}" var="detalle">

                <div class="producto">

                    <h:graphicImage value="/resources/images/#{detalle.vinilo.imagen}"
                                    styleClass="portada"
                                    alt="Portada del vinilo"/>

                    <div class="datos">
                        <h3>#{detalle.vinilo.nombre}</h3>
                        <p>Artista: #{detalle.vinilo.artista}</p>
                        <p>Precio:
                            <h:outputText value="#{detalle.vinilo.precio}">
                                <f:convertNumber type="currency" currencySymbol="$" locale="es_MX"/>
                            </h:outputText>
                        </p>
                    </div>

                    <div class="acciones-producto">

                        <div class="control-cantidad">

                            <h:commandButton value="−"
                                             action="#{carritoBean.disminuirCantidad(detalle)}"
                                             disabled="#{detalle.cantidad le 1}"
                                             styleClass="boton-cantidad">
                                <p:ajax process="@this" update="@form"/>
                            </h:commandButton>

                            <h:outputText value="#{detalle.cantidad}"
                                          styleClass="numero-cantidad"/>

                            <h:commandButton value="+"
                                             action="#{carritoBean.aumentarCantidad(detalle)}"
                                             styleClass="boton-cantidad">
                                <p:ajax process="@this" update="@form"/>
                            </h:commandButton>

                        </div>

                        <h:commandButton value="Eliminar"
                                         action="#{carritoBean.eliminar(detalle)}"
                                         styleClass="boton-eliminar">
                            <p:ajax process="@this" update="@form"/>
                        </h:commandButton>

                    </div>

                </div>

            </ui:repeat>

            <!-- Resumen -->
            <div class="resumen">

                <p>
                    Subtotal:
                    <h:outputText value="#{carritoBean.subtotal}">
                        <f:convertNumber type="currency" currencySymbol="$" locale="es_MX"/>
                    </h:outputText>
                </p>

                <p class="total">
                    Total:
                    <h:outputText value="#{carritoBean.subtotal}">
                        <f:convertNumber type="currency" currencySymbol="$" locale="es_MX"/>
                    </h:outputText>
                </p>

                <div class="resumen-acciones">

                    <h:link outcome="/index.xhtml" styleClass="seguir">
                        Seguir comprando
                    </h:link>

                    <h:panelGroup rendered="#{not empty carritoBean.detalles}">
                        <h:button value="Comprar"
                                  outcome="checkout"
                                  styleClass="boton-comprar"/>
                    </h:panelGroup>

                </div>

            </div>

        </h:form>

    </div>

</h:body>

</html>
