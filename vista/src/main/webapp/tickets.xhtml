<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Tickets de compra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
    <h:outputStylesheet library="css" name="admin.css"/>
</h:head>

<h:body>

    <ui:include src="/menu-admin.xhtml">
        <ui:param name="activo" value="tickets"/>
    </ui:include>

    <main class="contenido">

        <h1 class="titulo-pagina">Tickets de compra</h1>

        <p:growl id="msgs" showDetail="true" life="6000"/>

        <section class="panel">

            <h:form id="formTickets">

                <p:dataTable id="tablaTickets"
                             value="#{ticketsBean.tickets}"
                             var="t"
                             style="width: 100%;"
                             selectionMode="single"
                             selection="#{ticketsBean.ticketSeleccionado}"
                             rowKey="#{t.id}"
                             paginator="true"
                             rows="10"
                             emptyMessage="Todavía no hay tickets de compra">

                    <p:ajax event="rowSelect"
                            listener="#{ticketsBean.cargarDetalles}"
                            update=":formDetalle"/>

                    <p:column headerText="Folio">
                        <h:outputText value="#{ticketsBean.folio(t)}"/>
                    </p:column>

                    <p:column headerText="Fecha">
                        <h:outputText value="#{ticketsBean.formatoFecha(t.fecha)}"/>
                    </p:column>

                    <p:column headerText="Cliente">
                        <h:outputText value="#{t.usuario.nombreUsuario}"/>
                    </p:column>

                    <p:column headerText="Correo">
                        <h:outputText value="#{t.usuario.correo}"/>
                    </p:column>

                    <p:column headerText="Total">
                        <h:outputText value="#{t.total}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p:column>

                </p:dataTable>

                <div class="botones">
                    <h:commandButton value="Actualizar" action="#{ticketsBean.cargar}" styleClass="btn-sec">
                        <p:ajax process="@this" update=":formTickets :formDetalle"/>
                    </h:commandButton>
                </div>

            </h:form>

        </section>

        <section class="panel">

            <h:form id="formDetalle">

                <h2>
                    <h:outputText value="Detalle del ticket #{ticketsBean.folio(ticketsBean.ticketSeleccionado)}"
                                  rendered="#{ticketsBean.ticketSeleccionado != null}"/>
                    <h:outputText value="Detalle del ticket"
                                  rendered="#{ticketsBean.ticketSeleccionado == null}"/>
                </h2>

                <h:panelGroup rendered="#{ticketsBean.ticketSeleccionado == null}">
                    <div class="vacio">Selecciona un ticket de la tabla para ver sus productos.</div>
                </h:panelGroup>

                <p:dataTable value="#{ticketsBean.detalles}"
                             var="d"
                             style="width: 100%;"
                             rendered="#{ticketsBean.ticketSeleccionado != null}"
                             emptyMessage="Este ticket no tiene productos">

                    <p:column headerText="Vinilo">
                        <h:outputText value="#{d.vinilo.nombre}"/>
                    </p:column>

                    <p:column headerText="Artista">
                        <h:outputText value="#{d.vinilo.artista}"/>
                    </p:column>

                    <p:column headerText="Cantidad">
                        <h:outputText value="#{d.cantidad}"/>
                    </p:column>

                    <p:column headerText="Precio unitario">
                        <h:outputText value="#{d.precioUnitario}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Importe">
                        <h:outputText value="#{d.precioUnitario * d.cantidad}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p:column>

                </p:dataTable>

            </h:form>

        </section>

    </main>

</h:body>
</html>
