<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Inventario de Vinilos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
    <h:outputStylesheet library="css" name="admin.css"/>
</h:head>

<h:body>

    <ui:include src="/menu-admin.xhtml">
        <ui:param name="activo" value="inventario"/>
    </ui:include>

    <main class="contenido">

        <h1 class="titulo-pagina">Inventario de vinilos</h1>

        <p:growl id="msgs" showDetail="true" life="5000"/>

        <!-- PARTE 1: Registro y modificación -->
        <section class="panel">

            <h:form id="formVinilo">

                <h2>Datos del vinilo</h2>

                <h:panelGroup id="formularioVinilo" layout="block" styleClass="campos">

                    <div class="campo">
                        <h:outputLabel value="Nombre *" styleClass="labels"/>
                        <p:inputText value="#{viniloBean.nombre}"
                                     placeholder="Nombre del vinilo"
                                     required="true"
                                     requiredMessage="El nombre es obligatorio"
                                     maxlength="50"
                                     validatorMessage="El texto no tiene un formato válido"/>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="Género *" styleClass="labels"/>
                        <p:selectOneMenu value="#{viniloBean.genero}"
                                         required="true"
                                         requiredMessage="El género es obligatorio">
                            <f:selectItem itemLabel="Rock" itemValue="Rock"/>
                            <f:selectItem itemLabel="Pop" itemValue="Pop"/>
                            <f:selectItem itemLabel="Jazz" itemValue="Jazz"/>
                            <f:selectItem itemLabel="Electrónica" itemValue="Electrónica"/>
                            <f:selectItem itemLabel="Clásica" itemValue="Clásica"/>
                        </p:selectOneMenu>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="Descripción *" styleClass="labels"/>
                        <p:inputText value="#{viniloBean.descripcion}"
                                     placeholder="Descripción del vinilo"
                                     required="true"
                                     requiredMessage="La descripción es obligatoria"
                                     maxlength="200"/>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="Artista *" styleClass="labels"/>
                        <p:inputText value="#{viniloBean.artista}"
                                     placeholder="Nombre del artista"
                                     required="true"
                                     requiredMessage="El artista es obligatorio"
                                     maxlength="50"
                                     validatorMessage="El texto no tiene un formato válido"/>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="Precio *" styleClass="labels"/>
                        <p:inputText value="#{viniloBean.precio}"
                                     placeholder="0.00"
                                     required="true"
                                     requiredMessage="El precio es obligatorio"
                                     converterMessage="El precio debe ser un número válido, por ejemplo 250.00"
                                     validatorMessage="El precio debe ser mayor que cero y no superar 99999999">
                            <f:convertNumber type="number" locale="en_US"/>
                            <f:validateDoubleRange minimum="0.01" maximum="99999999"/>
                        </p:inputText>
                    </div>

                    <div class="campo">
                        <h:outputLabel value="Imagen (URL del bucket) *" styleClass="labels"/>
                        <p:inputText value="#{viniloBean.imagen}"
                                     placeholder="https://tu-bucket.publico/imagen.jpg"
                                     required="true"
                                     requiredMessage="La imagen es obligatoria"/>
                    </div>

                </h:panelGroup>

                <!-- Botones -->
                <div class="botones">

                    <p:commandButton id="botonGuardar"
                                     value="Guardar"
                                     action="#{viniloBean.guardarVinilo}"
                                     styleClass="btn-admin"
                                     process="@form"
                                     update=":formVinilo :formTabla:tablaVinilos :msgs"/>

                    <p:commandButton id="botonModificar"
                                     value="Modificar"
                                     action="#{viniloBean.modificarVinilo}"
                                     disabled="#{viniloBean.viniloSeleccionado == null}"
                                     styleClass="btn-admin"
                                     process="@form"
                                     update=":formVinilo :formTabla:tablaVinilos :msgs"/>

                    <p:commandButton id="botonEliminar"
                                     value="Eliminar"
                                     action="#{viniloBean.eliminarVinilo}"
                                     disabled="#{viniloBean.viniloSeleccionado == null}"
                                     onclick="if (!confirm('¿Estás seguro de eliminar este vinilo?')) { return false; }"
                                     styleClass="btn-peligro"
                                     process="@this"
                                     update=":formVinilo :formTabla:tablaVinilos :msgs"/>

                    <p:commandButton value="Limpiar"
                                     action="#{viniloBean.limpiarCampos}"
                                     immediate="true"
                                     styleClass="btn-sec"
                                     process="@this"
                                     update=":formVinilo"
                                     resetValues="true"/>

                </div>

            </h:form>

        </section>

        <!-- PARTE 2: Buscador y tabla -->
        <div class="barra-tabla">

            <h2 class="subtitulo-pagina">Vinilos registrados</h2>

            <h:form id="formBusqueda">
                <p:inputText id="buscador"
                             value="#{viniloBean.filtroNombre}"
                             placeholder="Buscar por nombre"
                             styleClass="buscador-admin">
                    <p:ajax event="keyup"
                            delay="250"
                            process="@this"
                            update=":formTabla:tablaVinilos"/>
                </p:inputText>
            </h:form>

        </div>

        <section class="panel">

            <h:form id="formTabla">

                <p:dataTable id="tablaVinilos"
                             value="#{viniloBean.buscarVinilos()}"
                             var="vinilo"
                             style="width: 100%;"
                             selection="#{viniloBean.viniloSeleccionado}"
                             rowKey="#{vinilo.idVinilo}"
                             selectionMode="single"
                             emptyMessage="No se encontraron vinilos">

                    <p:ajax event="rowSelect"
                            listener="#{viniloBean.cargarViniloSeleccionado}"
                            update=":formVinilo:formularioVinilo
                                    :formVinilo:botonModificar
                                    :formVinilo:botonEliminar"/>

                    <p:column headerText="ID">
                        <h:outputText value="#{vinilo.idVinilo}"/>
                    </p:column>

                    <p:column headerText="Nombre">
                        <h:outputText value="#{vinilo.nombre}"/>
                    </p:column>

                    <p:column headerText="Género">
                        <h:outputText value="#{vinilo.genero}"/>
                    </p:column>

                    <p:column headerText="Descripción">
                        <h:outputText value="#{vinilo.descripcion}"/>
                    </p:column>

                    <p:column headerText="Artista">
                        <h:outputText value="#{vinilo.artista}"/>
                    </p:column>

                    <p:column headerText="Cantidad">
                        <h:outputText value="#{vinilo.cantidad}"/>
                    </p:column>

                    <p:column headerText="Precio">
                        <h:outputText value="#{vinilo.precio}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Imagen">
                        <h:panelGroup rendered="#{not empty vinilo.imagen}">
                            <img class="miniatura"
                                 src="#{vinilo.imagen.startsWith('http') ? vinilo.imagen : request.contextPath.concat('/resources/images/').concat(vinilo.imagen)}"
                                 alt="Portada"/>
                        </h:panelGroup>
                    </p:column>

                </p:dataTable>

            </h:form>

        </section>

    </main>

</h:body>
</html>
