<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">


<h:head>
    <title>Checkout</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8eeee;
            color: #514747;
        }

        .barra {
            background-color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px #dddddd;
        }

        .barra a {
            color: #514747;
            text-decoration: none;
            font-weight: bold;
        }

        .contenedor {
            display: grid;
            max-width: 850px;
            margin: 30px auto;
            gap: 30px;
            grid-template-columns: 1fr 400px;
        }

        .columnaizq{

        }

        .columnader{
            border-radius: 8px;
            background-color: #d84c58;
            padding: 20px;
            color: white;
        }

        .columnasup{
            border-radius: 8px;
            background-color: white;
            padding: 20px;
            margin-bottom: 30px;
        }

        .columnainf{
            border-radius: 8px;
            background-color: white;
            padding: 20px;
        }

        .primera_fila,
        .segunda_fila,
        .tercera_fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            grid-auto-flow: column;
            gap: 6px 16px;
            margin-bottom: 16px;
        }

        .primera_fila input,
        .segunda_fila input,
        .tercera_fila input {
            width: 100%;
            box-sizing: border-box;
        }

        .fila_completa {
            margin-bottom: 16px;
        }

        .fila_completa label {
            display: block;
            margin-bottom: 6px;
        }

        .fila_completa input {
            width: 100%;
            box-sizing: border-box;
        }

        h3{
            margin: 5px;
            text-align: center;
            color: #d84c58;
        }

        h2 {
            margin-top: 0;
            color: #d84c58;
        }

        .producto {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .portada {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background-color: #fafafa;
        }

        .datos {
            flex: 1;
        }

        .datos h3 {
            margin: 0 0 8px;
        }

        .datos p {
            margin: 5px 0;
            font-size: 14px;
        }

        .cantidad {
            width: 45px;
            padding: 5px;
        }

        .resumen {
            text-align: right;
            margin-top: 20px;
        }

        .total {
            font-size: 20px;
            font-weight: bold;
            color: #d84c58;
        }

        .boton {
            display: inline-block;
            background-color: #514747;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .boton:hover {
            background-color: #766363;
        }

        .seguir {
            color: #514747;
            text-decoration: none;
            margin-right: 15px;
        }

        .titulo{
            text-align: center;
        }

        @media (max-width: 500px) {
            .contenedor {
                margin: 15px;
                padding: 15px;
            }

            .producto {
                gap: 10px;
            }

            .portada {
                width: 75px;
                height: 75px;
            }

            .barra {
                padding: 15px;
            }
        }
    </style>
</h:head>

<h:body>

    <div class="barra">
        <h:link outcome="/index.xhtml">
            Tienda de vinilos
        </h:link>

        <h:link outcome="/login.xhtml">
            Iniciar sesión
        </h:link>
    </div>

    <h:form id="formCheckout">
        <div class="contenedor">
            <div class="columnaizq">
                <div class="columnasup">
                    <h3>Informacion general</h3>
                    <div class="primera_fila">
                        <p:outputLabel for="estado" value="Estado"/>
                        <p:inputText id="estado"
                                     value="#{checkoutBean.estado}"
                                     required="true"
                                     requiredMessage="Ingresa tu estado de la república"/>
                        <p:outputLabel for="municipio" value="Municipio"/>
                        <p:inputText id="municipio"
                                     value="#{checkoutBean.municipio}"
                                     required="true"
                                     requiredMessage="Ingresa tu municipio"/>
                    </div>
                    <div class="segunda_fila">
                        <p:outputLabel for="ciudad" value="Ciudad"/>
                        <p:inputText id="ciudad"
                                     value="#{checkoutBean.ciudad}"
                                     required="true"
                                     requiredMessage="Ingresa tu ciudad"/>
                        <p:outputLabel for="calle" value="Calle"/>
                        <p:inputText id="calle"
                                     value="#{checkoutBean.calle}"
                                     required="true"
                                     requiredMessage="Ingresa tu calle"/>
                    </div>
                </div>

                <div class="columnainf">
                    <h3>Datos de pago</h3>

                    <div class="fila_completa">
                        <p:outputLabel for="numeroTarjeta" value="Número de tarjeta"/>
                        <p:inputMask id="numeroTarjeta"
                                     value="#{checkoutBean.numeroTarjeta}"
                                     mask="9999 9999 9999 9999"
                                     required="true"
                                     requiredMessage="Ingresa el número de tarjeta"/>
                    </div>

                    <div class="fila_completa">
                        <p:outputLabel for="titular" value="Nombre del titular"/>
                        <p:inputText id="titular"
                                     value="#{checkoutBean.titular}"
                                     required="true"
                                     requiredMessage="Ingresa el nombre del titular"/>
                    </div>

                    <div class="tercera_fila">
                        <p:outputLabel for="vencimiento" value="Vencimiento"/>
                        <p:inputMask id="vencimiento"
                                     value="#{checkoutBean.vencimiento}"
                                     mask="99/99"
                                     required="true"
                                     requiredMessage="Ingresa el vencimiento"/>
                        <p:outputLabel for="codigo" value="Código de seguridad"/>
                        <p:password id="codigo"
                                    value="#{checkoutBean.codigoSeguridad}"
                                    maxlength="4"
                                    required="true"
                                    requiredMessage="Ingresa el código de seguridad"/>
                    </div>
                    <div style="margin-top: 20px; text-align: center;">
                        <p:messages id="mensajes" closable="true"/>
                        <p:commandButton value="Pagar"
                                         action="#{checkoutBean.pagar}"
                                         process="@form"
                                         update="@form"
                                         styleClass="boton"/>
                    </div>
                </div>
            </div>

            <div class="columnader">
                <h3 style="color: white">Resumen del pedido</h3>

                <h:outputText value="Tu carrito está vacío" rendered="#{empty checkoutBean.detalles}"/>

                <ui:repeat value="#{checkoutBean.detalles}" var="d">
                    <p>
                        #{d.vinilo.nombre} (#{d.cantidad} x
                        <h:outputText value="#{d.vinilo.precio}">
                            <f:convertNumber type="currency" currencySymbol="$"/>
                        </h:outputText>)
                    </p>
                </ui:repeat>

                <p>Subtotal:
                    <h:outputText value="#{checkoutBean.subtotal}">
                        <f:convertNumber type="currency" currencySymbol="$"/>
                    </h:outputText>
                </p>
                <p>Envío:
                    <h:outputText value="#{checkoutBean.envio}">
                        <f:convertNumber type="currency" currencySymbol="$"/>
                    </h:outputText>
                </p>
                <p><b>Total:
                    <h:outputText value="#{checkoutBean.total}">
                        <f:convertNumber type="currency" currencySymbol="$"/>
                    </h:outputText>
                </b></p>
            </div>
        </div>

    </h:form>

</h:body>
</html>
