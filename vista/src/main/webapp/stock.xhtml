<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Stock - Inventario de Vinilos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="css" name="style.css"/>
    <h:outputStylesheet library="css" name="admin.css"/>
</h:head>

<h:body>

    <ui:include src="/menu-admin.xhtml">
        <ui:param name="activo" value="stock"/>
    </ui:include>

    <main class="contenido">

        <h1 class="titulo-pagina">Stock</h1>

        <p:growl id="msgs" showDetail="true" life="4000"/>

        <h:form id="formStock">

            <div class="stock-grid">

                <ui:repeat value="#{viniloBean.buscarVinilos()}" var="vinilo">

                    <div class="stock-card #{viniloBean.isSinStock(vinilo.idVinilo) ? 'sin-stock' : ''}">

                        <h:outputText value="SIN STOCK"
                                      styleClass="sello-sin-stock"
                                      rendered="#{viniloBean.isSinStock(vinilo.idVinilo)}"/>

                        <h:panelGroup rendered="#{not empty vinilo.imagen}">
                            <img class="stock-imagen"
                                 src="#{vinilo.imagen.startsWith('http') ? vinilo.imagen : request.contextPath.concat('/resources/images/').concat(vinilo.imagen)}"
                                 alt="Portada"/>
                        </h:panelGroup>

                        <div class="stock-nombre">#{vinilo.nombre}</div>

                        <div class="stock-control">

                            <h:commandButton value="−"
                                             action="#{viniloBean.disminuirStock(vinilo.idVinilo)}"
                                             disabled="#{viniloBean.isSinStock(vinilo.idVinilo)}"
                                             styleClass="stock-btn">
                                <p:ajax process="@this" update=":formStock :msgs"/>
                            </h:commandButton>

                            <span class="stock-input">#{viniloBean.getCantidadStock(vinilo.idVinilo)}</span>

                            <h:commandButton value="+"
                                             action="#{viniloBean.aumentarStock(vinilo.idVinilo)}"
                                             styleClass="stock-btn">
                                <p:ajax process="@this" update=":formStock :msgs"/>
                            </h:commandButton>

                        </div>

                        <div class="stock-cantidad">
                            Stock: #{viniloBean.getCantidadStock(vinilo.idVinilo)}
                        </div>

                    </div>

                </ui:repeat>

            </div>

        </h:form>

    </main>

</h:body>
</html>
